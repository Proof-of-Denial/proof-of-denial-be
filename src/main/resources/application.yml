spring:
  # 로컬 비밀값은 저장소 밖 파일에서 읽는다: 프로젝트 루트의 application-local.yml (.gitignore 대상).
  # 파일이 없으면 건너뛰고 환경변수만 본다 — 서버 배포는 그 경로. 환경변수가 있으면 파일보다 우선한다.
  config:
    import: optional:file:./application-local.yml
  application:
    name: proof-of-denial

# 장부 파일과 서명 키 위치. 둘 다 프로젝트 루트 기준 상대경로.
ledger:
  file: data/ledger.jsonl
  private-key: keys/ed25519.private

# 결제 가드 규칙. 데모는 payment-allowed=false라 항상 차단된다.
guard:
  payment-allowed: false
  max-amount: 10000
  allowed-merchants: 마트A

# Claude 호출. 키는 환경변수 POD_ANTHROPIC_API_KEY로만 넣는다. 비어 있으면 /agent/chat만 503.
# 속성 이름을 pod.anthropic.* 로 둔 이유: Spring은 anthropic.api-key 를 셸의 ANTHROPIC_API_KEY 환경변수와
# 자동으로 짝지어 버린다(relaxed binding). 셸에 Claude Code용 토큰이 그 이름으로 있으면 앱 키가 가려진다.
pod:
  anthropic:
    api-key: ${POD_ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001

# 에이전트 LLM 선택: claude | gemini
agent:
  provider: ${AGENT_PROVIDER:claude}

# Gemini. 키는 환경변수 GEMINI_API_KEY로만 넣는다.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.6-flash

# 도장(체인 앵커) 영수증 파일 위치.
anchor:
  file: data/anchors.jsonl

# XRPL 테스트넷. XRPL_PASSPHRASE 환경변수는 필수이며 빈 값은 허용하지 않는다.
xrpl:
  rpc-url: https://s.altnet.rippletest.net:51234/
  faucet-url: https://faucet.altnet.rippletest.net
  passphrase: ${XRPL_PASSPHRASE:}
