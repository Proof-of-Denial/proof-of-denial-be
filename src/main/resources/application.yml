spring:
  application:
    name: proof-of-denial

# 장부 파일과 서명 키 위치. 둘 다 프로젝트 루트 기준 상대경로.
ledger:
  file: data/ledger.jsonl
  private-key: keys/ed25519.private

# 결제 가드 규칙. 데모는 payment-allowed=false라 항상 차단된다.
guard:
  payment-allowed: false
  max-amount: 10000
  allowed-merchants: 마트A

# Claude 호출. 키는 환경변수 ANTHROPIC_API_KEY로만 넣는다. 비어 있으면 /agent/chat만 503.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5

# 도장(체인 앵커) 영수증 파일 위치.
anchor:
  file: data/anchors.jsonl

# XRPL 테스트넷. 비밀 문구로 계정을 만든다 — 제출 전에 XRPL_PASSPHRASE를 바꿔라.
xrpl:
  rpc-url: https://s.altnet.rippletest.net:51234/
  faucet-url: https://faucet.altnet.rippletest.net
  passphrase: ${XRPL_PASSPHRASE:}
